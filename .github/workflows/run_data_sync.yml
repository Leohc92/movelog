name: Run Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: coros-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.COROS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-coros.txt
      - name: Install dependencies
        run: pip install -r requirements-coros.txt
      - name: Sync COROS activities
        env:
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: python run_page/coros_sync.py
      - name: Publish activity data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/static/activities.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: sync COROS activities'
            git push
          fi

  publish_github_pages:
    needs: sync
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gh-pages.yml
